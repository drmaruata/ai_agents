[project]
name = "ruata-ai-platform"
version = "0.1.0"
description = "Hybrid cloud and local AI software development agent platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "websockets>=15,<16",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "openai-agents>=0.21,<0.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
